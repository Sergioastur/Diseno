<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-4">
                <h2 class="display-6">Formulario de registro</h2>
                <form class="border border-primary rounded p-3">
                    <div class="mb-3">
                        <label for="nombre" class="form-label text-primary">Nombre</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre">
                        
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label text-primary">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo electrónico">
                    </div>
                    <div class="mb-3">
                        <label for="contra" class="form-label text-primary">Contraseña</label>
                        <input type="password" class="form-control" id="contra" placeholder="Ingresa tu contraseña">
                    </div>
                    <div class="mb-3">
                        <label for="edad" class="form-label text-primary">Edad</label>
                        <input type="number" class="form-control" id="edad" min="1" max="120" placeholder="Ingresa tu edad">
                    </div>
                    <div class="mb-3">
                        <label for="pais" class="form-label text-primary">País</label>
                        <select class="form-select" aria-label="Default select example" id="pais">
                            <option class="text-secondary" selected>Selecciona tu país</option>
                            <option value="es">España</option>
                            <option value="fr">Francia</option>
                            <option value="us">Estados Unidos</option>
                          </select>
                    </div>
                    <div class="mb-3">
                        <label for="genero" class="form-label text-primary">Género</label>
                        <br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="genero" id="m" value="m">
                            <label class="form-check-label" for="m">Masculino</label>
                          </div>
                          <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="genero" id="f" value="f">
                            <label class="form-check-label" for="f">Femenino</label>
                          </div>
                          <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="genero" id="o" value="o">
                            <label class="form-check-label" for="o">Otro</label>
                          </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Registrarse</button>
                </form>
            </div>
        </div>
    </div>
    <!--JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
