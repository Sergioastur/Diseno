<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Galería</title>
    <link rel="stylesheet" href="css/estilos.css">
    <!--CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../css/styles.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>
<body>
    <div class="container-fluid bg-principal">
        <div class="row">
            <nav class="navbar navbar-expand-lg bg-header">
                <div class="container-fluid">
                    <a class="navbar-brand h1-header" href="../index.html">FIDMA</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                        aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarText">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link nav-text active" aria-current="page" href="../index.html">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-text" href="galeria.html">Galería</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-text" href="mapa.html">Mapa</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link nav-text" href="entradas.html">Entradas</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
        <div class="row row-cols-2">
            <div class="col">
                <form>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" aria-describedby="nombreHelp">
                            <div id="nombreHelp" class="form-text">Introduce tu nombre</div>
                        </div>
                        <div class="col">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="apellidos" aria-describedby="apellidosHelp">
                            <div id="apellidosHelp" class="form-text">Introduce tus apellidos</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">Introduce tu email</div>
                    </div>
                    <div class="mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" aria-describedby="telefonoHelp">
                        <div id="telefonoHelp" class="form-text">Introduce tu teléfono</div>
                    </div>
                    <div class="mb-3">
                        <label for="entrada" class="form-label">Entrada</label>
                        <select class="form-select" id="entrada" aria-describedby="entradaHelp">
                            <option selected>Selecciona una entrada</option>
                            <option value="1">Entrada general</option>
                            <option value="2">Entrada niño</option>
                        </select>
                        <div id="entradaHelp" class="form-text">Selecciona el tipo de entrada</div>
                    </div>
                    <div class="mb3">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input type="date" class="form-control" id="fecha" aria-describedby="fechaHelp">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="politica">
                        <label class="form-check-label" for="politica">He leído y acepto la política de privacidad</label>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </form>
            </div>
            <div class="col">
                <h1 class="text-center mt-3 mb-3 rounded">Entradas</h1>
            </div>
        </div>
        <div class="row">
            
        </div>
        
        <div class="row">
            <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-0">
                <div class="col-md-4 d-flex align-items-center">
                    <a href="#" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
                        <img src="../img/logo.png" alt="logo" width="30" height="24">
                    </a>
                    <span class="mb-3 mb-md-0 text-footer">© 2025 Sergio Saavedra</span>
                </div>

                <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
                    <li class="ms-3"><a href="https://twitter.com/fidmagijon?lang=es"><i class="bi bi-twitter-x"></i></a></li>
                    <li class="ms-3"><a href="https://www.facebook.com/Feriasturias/?locale=es_ES"><i class="bi bi-facebook"></i></a></li>
                </ul>
            </footer>
        </div>
    </div>
</body>

</html>
